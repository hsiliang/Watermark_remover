# 推到 main 後：先跑測試，通過才部署到 Azure App Service。
# 只需設定一次（見 docs/deploy-azure.md「GitHub Actions 自動部署」）：
#   1. 開啟 App Service 的 SCM 基本驗證
#   2. 把發行設定檔存成 GitHub secret：AZURE_WEBAPP_PUBLISH_PROFILE
name: Deploy to Azure

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'bench/**'
  workflow_dispatch:

# 連續合併時依序部署，不平行、不取消進行中的部署。
concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: wmr-9b0686fe

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and test
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      - name: Smoke test
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${AZURE_WEBAPP_NAME}.azurewebsites.net/robots.txt" || true)
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::部署後網站沒有回應（最後狀態 $code）"
          exit 1
