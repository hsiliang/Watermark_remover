name: CI

# 只跑 PR：推到 main 時 deploy-azure.yml 會先測試再部署，這裡再跑一次只是重複。
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'bench/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
